info:
  name: Atualizar matéria com ID inválido
  type: http
  seq: 36
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/subjects/abc"
  body:
    type: json
    data: |-
      {
        "nome": "Matéria inválida"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejeita ID inválido ao atualizar matéria", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
