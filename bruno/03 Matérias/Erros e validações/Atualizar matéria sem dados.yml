info:
  name: Atualizar matéria sem dados
  type: http
  seq: 37
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/subjects/{{emptyPatchSubjectId}}"
  body:
    type: json
    data: |-
      {}

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const userResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Professor para PATCH vazio",
            email: `professor-patch-vazio-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (userResponse.status !== 201) {
          throw new Error("Não foi possível criar o professor para o PATCH vazio");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para PATCH vazio",
            professorId: userResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para o PATCH vazio");
        }

        bru.setVar("emptyPatchSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("emptyPatchSubjectProfessorId", String(userResponse.data.data.id));
    - type: after-response
      code: |-
        const subjectId = bru.getVar("emptyPatchSubjectId");
        const professorId = bru.getVar("emptyPatchSubjectProfessorId");

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/subjects/${subjectId}`
          });
        }

        if (professorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${professorId}`
          });
        }
    - type: tests
      code: |-
        test("Exige ao menos um campo no PATCH de matéria", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
