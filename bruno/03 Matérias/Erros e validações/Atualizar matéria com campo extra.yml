info:
  name: Atualizar matéria com campo extra
  type: http
  seq: 57
  tags:
    - aula-06

http:
  method: PATCH
  url: "{{baseUrl}}/v1/subjects/{{strictPatchSubjectId}}"
  body:
    type: json
    data: |-
      {
        "campoExtra": true
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const userResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Professor para campo extra",
            email: `professor-campo-extra-${suffix}@exemplo.com`
          }
        });

        if (userResponse.status !== 201) {
          throw new Error("Não foi possível criar o professor para validar campo extra");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para campo extra",
            professorId: userResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para validar campo extra");
        }

        bru.setVar("strictPatchSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("strictPatchProfessorId", String(userResponse.data.data.id));
    - type: after-response
      code: |-
        const subjectId = bru.getVar("strictPatchSubjectId");
        const professorId = bru.getVar("strictPatchProfessorId");

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/subjects/${subjectId}`
          });
        }

        if (professorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${professorId}`
          });
        }
    - type: tests
      code: |-
        test("Rejeita campos não permitidos no PATCH de matéria", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
