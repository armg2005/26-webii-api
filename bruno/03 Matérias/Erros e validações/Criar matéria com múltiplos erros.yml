info:
  name: Criar matéria com múltiplos erros
  type: http
  seq: 58
  tags:
    - aula-06

http:
  method: POST
  url: "{{baseUrl}}/v1/subjects"
  body:
    type: json
    data: |-
      {
        "nome": " ",
        "professorId": "invalido",
        "campoExtra": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejeita dados inválidos e campos extras na criação de matéria", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.error.details.length).to.be.greaterThan(1);
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/v1/subjects");
        });

settings:
  encodeUrl: true
