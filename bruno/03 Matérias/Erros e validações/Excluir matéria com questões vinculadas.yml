info:
  name: Excluir matéria com questões vinculadas
  type: http
  seq: 39
  tags:
    - atividade-05

http:
  method: DELETE
  url: "{{baseUrl}}/v1/subjects/{{linkedSubjectId}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const userResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Professor da matéria vinculada",
            email: `professor-materia-vinculada-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (userResponse.status !== 201) {
          throw new Error("Não foi possível criar o professor da matéria vinculada");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria temporária com questão",
            professorId: userResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria temporária para o vínculo");
        }

        const questionResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/questions`,
          headers: { "Content-Type": "application/json" },
          data: {
            enunciado: "Questão temporária para vínculo",
            dificuldade: 1,
            subjectId: subjectResponse.data.data.id,
            authorId: userResponse.data.data.id
          }
        });

        if (questionResponse.status !== 201) {
          throw new Error("Não foi possível criar a questão temporária para o vínculo");
        }

        bru.setVar("linkedSubjectProfessorId", String(userResponse.data.data.id));
        bru.setVar("linkedSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("linkedSubjectQuestionId", String(questionResponse.data.data.id));
    - type: after-response
      code: |-
        const questionId = bru.getVar("linkedSubjectQuestionId");

        if (questionId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/questions/${questionId}`
          });
        }

        const subjectId = bru.getVar("linkedSubjectId");

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/subjects/${subjectId}`
          });
        }

        const professorId = bru.getVar("linkedSubjectProfessorId");

        if (professorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${professorId}`
          });
        }
    - type: tests
      code: |-
        test("Impede excluir matéria com questões vinculadas", function() {
          expect(res.status).to.equal(409);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("CONFLICT");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
