info:
  name: Criar matéria
  type: http
  seq: 7
  tags:
    - atividade-04

http:
  method: POST
  url: "{{baseUrl}}/v1/subjects"
  body:
    type: json
    data: |-
      {
        "nome": "  Matéria de teste {{runId}}  ",
        "professorId": {{subjectProfessorId}}
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const runId = bru.getVar("runId") ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        bru.setVar("runId", runId);

        const response = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Professor da matéria",
            email: `professor-materia-${runId}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (response.status !== 201) {
          throw new Error("Não foi possível criar o professor da matéria");
        }

        bru.setVar("subjectProfessorId", String(response.data.data.id));
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("subjectId", String(res.body.data.id));
        }
    - type: tests
      code: |-
        test("Cria uma matéria", function() {
          expect(res.status).to.equal(201);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("professor");
          expect(res.body.data.nome).to.equal(`Matéria de teste ${bru.getVar("runId")}`);
        });

settings:
  encodeUrl: true
