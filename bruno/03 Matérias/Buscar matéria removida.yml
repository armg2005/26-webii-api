info:
  name: Buscar matéria removida
  type: http
  seq: 51
  tags:
    - atividade-05

http:
  method: GET
  url: "{{baseUrl}}/v1/subjects/{{subjectId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Confirma que a matéria foi removida", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
