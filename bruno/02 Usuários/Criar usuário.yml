info:
  name: Criar usuário
  type: http
  seq: 3
  tags:
    - aula-04

http:
  method: POST
  url: "{{baseUrl}}/v1/users"
  body:
    type: json
    data: |-
      {
        "nome": "  Usuário de teste {{runId}}  ",
        "email": "USUARIO-{{runId}}@EXEMPLO.COM",
        "papel": "PROFESSOR"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const runId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        bru.setVar("runId", runId);
        bru.setVar("userEmail", `usuario-${runId}@exemplo.com`);
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("userId", String(res.body.data.id));
        }
    - type: tests
      code: |-
        test("Cria um usuário", function() {
          expect(res.status).to.equal(201);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("email");
          expect(res.body.data.nome).to.equal(`Usuário de teste ${bru.getVar("runId")}`);
          expect(res.body.data.email).to.equal(`usuario-${bru.getVar("runId")}@exemplo.com`);
        });

settings:
  encodeUrl: true
