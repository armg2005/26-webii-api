info:
  name: Buscar usuário removido
  type: http
  seq: 53
  tags:
    - aula-05

http:
  method: GET
  url: "{{baseUrl}}/v1/users/{{userId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Confirma que o usuário foi removido", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal(`/v1/users/${bru.getVar("userId")}`);
        });

settings:
  encodeUrl: true
