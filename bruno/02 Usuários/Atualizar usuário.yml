info:
  name: Atualizar usuário
  type: http
  seq: 28
  tags:
    - aula-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "nome": "Usuário atualizado {{runId}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Atualiza parcialmente um usuário", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.nome).to.equal(`Usuário atualizado ${bru.getVar("runId")}`);
        });

settings:
  encodeUrl: true
