info:
  name: Criar usuário com múltiplos erros
  type: http
  seq: 55
  tags:
    - aula-06

http:
  method: POST
  url: "{{baseUrl}}/v1/users"
  body:
    type: json
    data: |-
      {
        "nome": "A",
        "email": "email-inválido",
        "papel": "ALUNO",
        "campoExtra": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna todos os problemas de schema e rejeita campo extra", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.error.details.length).to.be.greaterThan(1);
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/v1/users");
        });

settings:
  encodeUrl: true
