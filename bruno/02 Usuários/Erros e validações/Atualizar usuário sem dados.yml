info:
  name: Atualizar usuário sem dados
  type: http
  seq: 30
  tags:
    - aula-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/users/{{emptyPatchUserId}}"
  body:
    type: json
    data: |-
      {}

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const response = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Usuário para PATCH vazio",
            email: `patch-vazio-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (response.status !== 201) {
          throw new Error("Não foi possível criar o usuário para o PATCH vazio");
        }

        bru.setVar("emptyPatchUserId", String(response.data.data.id));
    - type: after-response
      code: |-
        const userId = bru.getVar("emptyPatchUserId");

        if (userId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${userId}`
          });
        }
    - type: tests
      code: |-
        test("Exige ao menos um campo no PATCH", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
