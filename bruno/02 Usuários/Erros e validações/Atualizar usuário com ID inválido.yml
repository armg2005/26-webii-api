info:
  name: Atualizar usuário com ID inválido
  type: http
  seq: 29
  tags:
    - aula-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/users/abc"
  body:
    type: json
    data: |-
      {
        "nome": "Nome inválido"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejeita ID inválido na atualização", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
