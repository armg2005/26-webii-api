info:
  name: Criar usuário duplicado
  type: http
  seq: 15
  tags:
    - aula-04

http:
  method: POST
  url: "{{baseUrl}}/v1/users"
  body:
    type: json
    data: |-
      {
        "nome": "Usuário duplicado",
        "email": "{{duplicateSeedEmail}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const response = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Usuário base para duplicidade",
            email: `duplicidade-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (response.status !== 201) {
          throw new Error("Não foi possível criar o usuário base para a duplicidade");
        }

        bru.setVar("duplicateSeedId", String(response.data.data.id));
        bru.setVar("duplicateSeedEmail", response.data.data.email);
    - type: after-response
      code: |-
        const userId = bru.getVar("duplicateSeedId");

        if (userId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${userId}`
          });
        }
    - type: tests
      code: |-
        test("Rejeita email já cadastrado", function() {
          expect(res.status).to.equal(409);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("CONFLICT");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/v1/users");
        });

settings:
  encodeUrl: true
