info:
  name: Corpo acima do limite
  type: http
  seq: 102
  tags:
    - pratica-06

http:
  method: POST
  url: "{{baseUrl}}/v1/users"
  body:
    type: json
    data: |-
      {"nome": "{{largeName}}"}

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("largeName", "x".repeat(110000));
    - type: tests
      code: |-
        test("Preserva status e envelope para Corpo acima do limite", function() {
          expect(res.status).to.equal(413);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("PAYLOAD_TOO_LARGE");
          expect(res.body.path).to.equal("/v1/users");
          expect(res.body.timestamp).to.be.a("string");
        });

settings:
  encodeUrl: true
