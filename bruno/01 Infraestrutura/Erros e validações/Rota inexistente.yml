info:
  name: Rota inexistente
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/rota-inexistente"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna 404 para uma rota não cadastrada", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.error.hint).to.include("/v1");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/rota-inexistente");
        });

settings:
  encodeUrl: true
