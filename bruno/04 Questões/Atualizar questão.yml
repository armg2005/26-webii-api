info:
  name: Atualizar questão
  type: http
  seq: 40
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/questions/{{questionId}}"
  body:
    type: json
    data: |-
      {
        "dificuldade": 3,
        "respostaCorreta": null
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Atualiza parcialmente uma questão", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.dificuldade).to.equal(3);
          expect(res.body.data.respostaCorreta).to.equal(null);
        });

settings:
  encodeUrl: true
