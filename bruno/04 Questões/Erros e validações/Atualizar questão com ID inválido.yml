info:
  name: Atualizar questão com ID inválido
  type: http
  seq: 41
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/questions/abc"
  body:
    type: json
    data: |-
      {
        "dificuldade": 2
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejeita ID inválido ao atualizar questão", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
