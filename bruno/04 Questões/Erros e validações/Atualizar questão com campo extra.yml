info:
  name: Atualizar questão com campo extra
  type: http
  seq: 60
  tags:
    - aula-06

http:
  method: PATCH
  url: "{{baseUrl}}/v1/questions/{{strictPatchQuestionId}}"
  body:
    type: json
    data: |-
      {
        "campoExtra": true
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const authorResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor para campo extra",
            email: `autor-campo-extra-${suffix}@exemplo.com`
          }
        });

        if (authorResponse.status !== 201) {
          throw new Error("Não foi possível criar o autor para validar campo extra");
        }

        const authorId = authorResponse.data.data.id;
        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para campo extra",
            professorId: authorId
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para validar campo extra");
        }

        const subjectId = subjectResponse.data.data.id;
        const questionResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/questions`,
          headers: { "Content-Type": "application/json" },
          data: {
            enunciado: "Questão para campo extra",
            dificuldade: 2,
            subjectId,
            authorId
          }
        });

        if (questionResponse.status !== 201) {
          throw new Error("Não foi possível criar a questão para validar campo extra");
        }

        bru.setVar("strictPatchQuestionId", String(questionResponse.data.data.id));
        bru.setVar("strictPatchQuestionSubjectId", String(subjectId));
        bru.setVar("strictPatchQuestionAuthorId", String(authorId));
    - type: after-response
      code: |-
        const questionId = bru.getVar("strictPatchQuestionId");
        const subjectId = bru.getVar("strictPatchQuestionSubjectId");
        const authorId = bru.getVar("strictPatchQuestionAuthorId");

        if (questionId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/questions/${questionId}`
          });
        }

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/subjects/${subjectId}`
          });
        }

        if (authorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${authorId}`
          });
        }
    - type: tests
      code: |-
        test("Rejeita campos não permitidos no PATCH de questão", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
