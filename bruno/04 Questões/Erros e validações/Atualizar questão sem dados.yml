info:
  name: Atualizar questão sem dados
  type: http
  seq: 42
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/v1/questions/{{emptyPatchQuestionId}}"
  body:
    type: json
    data: |-
      {}

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const authorResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor para PATCH vazio",
            email: `autor-patch-vazio-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (authorResponse.status !== 201) {
          throw new Error("Não foi possível criar o autor para o PATCH vazio");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para PATCH vazio",
            professorId: authorResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para o PATCH vazio");
        }

        const questionResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/questions`,
          headers: { "Content-Type": "application/json" },
          data: {
            enunciado: "Questão para PATCH vazio",
            dificuldade: 1,
            respostaCorreta: "Resposta",
            subjectId: subjectResponse.data.data.id,
            authorId: authorResponse.data.data.id
          }
        });

        if (questionResponse.status !== 201) {
          throw new Error("Não foi possível criar a questão para o PATCH vazio");
        }

        bru.setVar("emptyPatchQuestionAuthorId", String(authorResponse.data.data.id));
        bru.setVar("emptyPatchQuestionSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("emptyPatchQuestionId", String(questionResponse.data.data.id));
    - type: after-response
      code: |-
        const questionId = bru.getVar("emptyPatchQuestionId");
        const subjectId = bru.getVar("emptyPatchQuestionSubjectId");
        const authorId = bru.getVar("emptyPatchQuestionAuthorId");

        if (questionId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/questions/${questionId}`
          });
        }

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/subjects/${subjectId}`
          });
        }

        if (authorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/v1/users/${authorId}`
          });
        }
    - type: tests
      code: |-
        test("Exige ao menos um campo no PATCH de questão", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
