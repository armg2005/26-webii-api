info:
  name: Excluir questão
  type: http
  seq: 48
  tags:
    - atividade-05

http:
  method: DELETE
  url: "{{baseUrl}}/v1/questions/{{questionId}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const baseUrl = bru.getEnvVar("baseUrl");
          const subjectId = bru.getVar("questionSubjectId");
          const authorId = bru.getVar("questionAuthorId");

          if (subjectId) {
            await bru.sendRequest({
              method: "DELETE",
              url: `${baseUrl}/v1/subjects/${subjectId}`
            });
          }

          if (authorId) {
            await bru.sendRequest({
              method: "DELETE",
              url: `${baseUrl}/v1/users/${authorId}`
            });
          }
        }
    - type: tests
      code: |-
        test("Exclui uma questão", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.id).to.equal(Number(bru.getVar("questionId")));
        });

settings:
  encodeUrl: true
