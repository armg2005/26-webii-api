info:
  name: Listar questões
  type: http
  seq: 10
  tags:
    - aula-03
    - aula-04

http:
  method: GET
  url: "{{baseUrl}}/v1/questions"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna todas as questões", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.be.an("array");
          expect(res.body.total).to.equal(res.body.data.length);
        });

        test("Inclui matéria e autor quando há questões cadastradas", function() {
          if (res.body.data.length === 0) {
            return;
          }

          const question = res.body.data[0];
          expect(question).to.have.property("id");
          expect(question).to.have.property("enunciado");
          expect(question).to.have.property("dificuldade");
          expect(question).to.have.property("subject");
          expect(question).to.have.property("author");
          expect(question.subject).to.have.property("id");
          expect(question.subject).to.have.property("nome");
          expect(question.author).to.have.property("id");
          expect(question.author).to.have.property("nome");
        });

settings:
  encodeUrl: true
