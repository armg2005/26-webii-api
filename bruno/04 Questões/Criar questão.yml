info:
  name: Criar questão
  type: http
  seq: 11
  tags:
    - atividade-04

http:
  method: POST
  url: "{{baseUrl}}/v1/questions"
  body:
    type: json
    data: |-
      {
        "enunciado": "  Quanto é 2 + 2? {{runId}}  ",
        "dificuldade": 1,
        "respostaCorreta": "4",
        "subjectId": {{questionSubjectId}},
        "authorId": {{questionAuthorId}}
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const runId = bru.getVar("runId") ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        bru.setVar("runId", runId);

        const authorResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor da questão",
            email: `autor-questao-${runId}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (authorResponse.status !== 201) {
          throw new Error("Não foi possível criar o autor da questão");
        }

        const questionAuthorId = authorResponse.data.data.id;
        bru.setVar("questionAuthorId", String(questionAuthorId));

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/v1/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria da questão",
            professorId: questionAuthorId
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria da questão");
        }

        bru.setVar("questionSubjectId", String(subjectResponse.data.data.id));
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("questionId", String(res.body.data.id));
        }
    - type: tests
      code: |-
        test("Cria uma questão", function() {
          expect(res.status).to.equal(201);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("subject");
          expect(res.body.data).to.have.property("author");
          expect(res.body.data.enunciado).to.equal(`Quanto é 2 + 2? ${bru.getVar("runId")}`);
        });

settings:
  encodeUrl: true
