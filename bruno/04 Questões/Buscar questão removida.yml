info:
  name: Buscar questão removida
  type: http
  seq: 49
  tags:
    - atividade-05

http:
  method: GET
  url: "{{baseUrl}}/v1/questions/{{questionId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Confirma que a questão foi removida", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
