info:
  name: Buscar questão por ID
  type: http
  seq: 12
  tags:
    - atividade-04

http:
  method: GET
  url: "{{baseUrl}}/v1/questions/{{questionId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Retorna a questão solicitada", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("subject");
          expect(res.body.data).to.have.property("author");
        });

settings:
  encodeUrl: true
